<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#f23f43" stroke-width="5" stroke-dasharray="60 210" transform="rotate(0 50 50)"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#f0b232" stroke-width="5" stroke-dasharray="60 210" transform="rotate(90 50 50)"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#23a55a" stroke-width="5" stroke-dasharray="60 210" transform="rotate(180 50 50)"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#00a8fc" stroke-width="5" stroke-dasharray="60 210" transform="rotate(270 50 50)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
  </g>
